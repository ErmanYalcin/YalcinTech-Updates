<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YalçınTech indir</title>
<meta name="description" content="YalçınTech masaüstü uygulamasının en son sürümünü indirin.">
<meta name="robots" content="noindex">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #f4f6f3; --card: #ffffff; --ink: #1c2b24; --muted: #5d6b63; --line: #dfe6df; --green: #11765b; --green-2: #0c604a; --blue: #2f6fca; --blue-2: #275fae; --shadow: 0 1px 2px rgb(15 36 28 / .05), 0 12px 32px rgb(15 36 28 / .08); }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1613; --card: #17211d; --ink: #e7efe9; --muted: #9aaba1; --line: #26332d; --shadow: none; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  main { width: min(520px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px 24px; box-shadow: var(--shadow); text-align: center; }
  img.logo { width: 84px; height: 84px; border-radius: 20px; }
  h1 { margin: 14px 0 4px; font-size: 26px; letter-spacing: -.02em; }
  .ver { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; margin: 0 0 10px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-weight: 700; font-size: 16px; text-decoration: none; transition: transform .12s, background .12s; }
  .btn:hover { transform: translateY(-1px); }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.primary:hover { background: var(--green-2); }
  .btn small { font-weight: 500; opacity: .8; font-size: 13px; }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .steps { text-align: left; margin: 18px 0 0; padding: 14px 16px; border-radius: 12px; background: var(--bg); color: var(--muted); font-size: 13.5px; }
  .steps:empty { display: none; }
  .steps b { color: var(--ink); }
  .steps p { margin: 0 0 6px; } .steps p:last-child { margin: 0; }
  .foot { margin: 18px 0 0; font-size: 12.5px; color: var(--muted); }
  .foot a { color: var(--muted); }
  .err { color: #b42318; font-size: 13.5px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="icon.png" alt="" width="84" height="84">
  <h1>YalçınTech</h1>
  <p class="ver" id="ver">En son sürüm bulunuyor…</p>
  <div id="buttons">
    <a class="btn primary" id="primary" href="https://github.com/ErmanYalcin/YalcinTech-Updates/releases/latest">İndirme sayfasını aç</a>
  </div>
  <div class="steps" id="steps"></div>
  <p class="foot">Kurulumdan sonra uygulama kendini otomatik günceller. · <a href="https://github.com/ErmanYalcin/YalcinTech-Updates/releases">Tüm sürümler</a></p>
</main>
<script>
(() => {
  const REPO = 'ErmanYalcin/YalcinTech-Updates';
  const win = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.5 10 4.5v7H3zM11 4.4 21 3v8.5H11zM3 12.5h7v7l-7-1zM11 12.5h10V21l-10-1.4z"/></svg>';
  const mac = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.6 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.6-1-2.6-3.9zM13.9 4.9c.7-.8 1.1-1.9 1-3-1 .1-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>';
  const ua = navigator.userAgent || '', isMac = /Macintosh|Mac OS X/.test(ua), isWin = /Windows/.test(ua);
  const mb = (n) => `${Math.round(n / 1048576)} MB`;
  const tr = (iso) => new Date(iso).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
  const $ = (id) => document.getElementById(id);
  fetch(`https://api.github.com/repos/${REPO}/releases/latest`, { headers: { Accept: 'application/vnd.github+json' } })
    .then((r) => { if (!r.ok) throw Error(String(r.status)); return r.json(); })
    .then((rel) => {
      const find = (re) => (rel.assets || []).find((a) => re.test(a.name));
      const exe = find(/Setup-[\d.]+\.exe$/i), dmg = find(/-universal\.dmg$/i);
      const v = String(rel.tag_name || '').replace(/^v/, '');
      $('ver').textContent = `Sürüm ${v} · ${tr(rel.published_at)}`;
      const link = (a, icon, label, primary) => a ? `<a class="btn${primary ? ' primary' : ''}" href="${a.browser_download_url}">${icon}<span>${label}</span><small>${mb(a.size)}</small></a>` : '';
      const w = link(exe, win, 'Windows için indir', !isMac), m = link(dmg, mac, 'Mac için indir', isMac);
      $('buttons').innerHTML = isMac ? m + w : w + m;
      $('steps').innerHTML = isMac
        ? '<p><b>Mac:</b> İnen .dmg dosyasını açın, YalçınTech simgesini Uygulamalar klasörüne sürükleyin.</p><p>İlk açılışta uyarı çıkarsa: simgeye sağ tıklayın → <b>Aç</b>.</p>'
        : '<p><b>Windows:</b> İnen kurulum dosyasını çalıştırın; kurulum kendiliğinden tamamlanır.</p><p>“Windows bilgisayarınızı korudu” uyarısı çıkarsa: <b>Ek bilgi → Yine de çalıştır</b>.</p>';
    })
    .catch(() => { $('ver').innerHTML = '<span class="err">Sürüm bilgisi alınamadı. Aşağıdaki düğmeyle indirme sayfasını açın.</span>'; });
})();
</script>
</body>
</html>
